[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wcgraph"
version = "0.1.0"
description = "Weighted, length-stratified conformal certification of variable-length agent trajectories over action graphs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.1", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["wcgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
